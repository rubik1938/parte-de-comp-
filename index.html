<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6TA. COMPAÑÍA</title>

<style>
*{ box-sizing: border-box; }

body{
    margin:0;
    padding:15px;
    padding-top:65px;
    background:#0d1117;
    color:white;
    font-family:Arial, sans-serif;
}

.container{
    max-width:1000px;
    margin:auto;
}

h1{
    text-align:center;
    color:#ffd700;
}

.resumen{
    display:flex;
    justify-content:space-around;
    background:#161b22;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

.card{ text-align:center; }

.numero{
    font-size:28px;
    font-weight:bold;
}

.panel{
    background:#161b22;
    padding:15px;
    border-radius:10px;
    margin-bottom:15px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}

input, select{ padding:8px; }

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#222;
    padding:8px;
}

td{
    padding:8px;
    border-bottom:1px solid #333;
}

.presente{ background:#103010; }
.ausente{ background:#3a1414; }
.oculto{ display:none; }

.parte{ width:100%; text-align:center; }
.parte td, .parte th{ border:1px solid #444; padding:8px; }

.estado-guardado{
    font-size:12px;
    color:#8b949e;
    text-align:center;
    margin-top:-5px;
    margin-bottom:15px;
}

#barraFlotante{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:50px;
    background:#0d1117;
    border-bottom:1px solid #30363d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    z-index:9999;
}

.grupo-izq{
    display:flex;
    gap:8px;
}

.btn-flotante{
    background:#1f2937;
    border:1px solid #444;
    border-radius:8px;
    padding:7px 13px;
    font-size:14px;
    color:white;
    cursor:pointer;
    transition: background 0.2s;
    white-space:nowrap;
}

.btn-flotante:hover{ background:#2d3748; }

.btn-flotante.activo{
    background:#374151;
    border-color:#6b7280;
}
</style>
</head>

<body>

<div id="barraFlotante">
    <div class="grupo-izq">
        <button class="btn-flotante" id="btnPersonal" onclick="togglePersonal()">👁 Personal</button>
        <button class="btn-flotante" id="btnAlumnos" onclick="toggleDetalleAlumnos()">📋 Alumnos</button>
    </div>
    <button class="btn-flotante" id="btnConfig" onclick="toggleConfig()">⚙️</button>
</div>

<div class="container">

<h1 id="tituloCompania">6TA COMPAÑÍA</h1>

<div id="estadoGuardado" class="estado-guardado">Datos cargados desde almacenamiento local</div>

<div class="resumen">
    <div class="card">
        <div>FUERZA</div>
        <div id="fuerza" class="numero">0</div>
    </div>
    <div class="card">
        <div>FORMAN</div>
        <div id="forman" class="numero">0</div>
    </div>
    <div class="card">
        <div>FALTAN</div>
        <div id="faltan" class="numero">0</div>
    </div>
</div>

<div class="panel">
    <table class="parte">
        <tr>
            <th></th>
            <th>P.P.</th>
            <th>ALM.</th>
            <th>TOTAL</th>
        </tr>
        <tr>
            <td><b>FUERZA</b></td>
            <td id="ppTotal">0</td>
            <td id="almTotal">0</td>
            <td id="totalGeneral">0</td>
        </tr>
        <tr>
            <td><b>FORMAN</b></td>
            <td id="ppForman">0</td>
            <td id="almForman">0</td>
            <td id="totalForman">0</td>
        </tr>
        <tr>
            <td><b>FALTAN</b></td>
            <td id="ppFaltan">0</td>
            <td id="almFaltan">0</td>
            <td id="totalFaltan">0</td>
        </tr>
    </table>
</div>

<div id="configuracion" class="panel oculto">

    <h3>Configuración</h3>

    <label>Nombre Compañía</label>
    <input type="text" id="inputNombreCompania" value="6TA. COMPAÑÍA" placeholder="Nombre de la compañía" style="width:220px;">

    <label>Fuerza P.P.</label>
    <input type="number" id="fuerzaPP" value="102">

    <label>Fuerza ALM.</label>
    <input type="number" id="fuerzaALM" value="75">

    <button onclick="guardarConfiguracion()">Guardar Configuración</button>

    <hr>

    <h3>Agregar Personal</h3>

    <select id="grado">
        <option>CAP</option>
        <option>TTE</option>
        <option>SG1</option>
        <option>SG2</option>
        <option>CB1</option>
        <option>CB2</option>
        <option>CBD.</option>
    </select>

    <input id="nombre" placeholder="Nombre">

    <select id="seccion">
        <option value="PP">P.P.</option>
        <option value="ALM">ALMNS.</option>
    </select>

    <button onclick="agregarPersonal()">Agregar</button>

    <hr>

    <button id="btnWhatsapp" onclick="generarMensaje()">📲 Generar Mensaje WhatsApp</button>
    &nbsp;
    <button onclick="borrarTodo()">🗑️ Borrar todos los datos</button>

</div>

<div id="personal" class="panel oculto">
    <h3>Personal</h3>
    <table>
        <thead>
            <tr>
                <th>Estado</th>
                <th>Grado</th>
                <th>Nombre</th>
                <th>Motivo</th>
            </tr>
        </thead>
        <tbody id="tablaPersonal"></tbody>
    </table>
</div>

<div id="panelDetalleAlumnos" class="panel oculto">
    <h3>Detalle Parte Alumnos</h3>

    <table>
        <thead>
            <tr>
                <th>Motivo</th>
                <th>Cantidad</th>
            </tr>
        </thead>
        <tbody id="tablaDetalleAlumnos"></tbody>
        <tfoot>
            <tr>
                <td><b>ALUMNOS FALTANTES</b></td>
                <td id="totalDetalleAlumnos"><b>0</b></td>
            </tr>
        </tfoot>
    </table>

    <br>

    <select id="motivoAlumno">
        <option value="">Seleccione motivo</option>
    </select>

    <input type="text" id="motivoAlumnoTexto" placeholder="Especifique..."
        style="display:none;margin-top:4px;background:#0d1117;color:white;border:1px solid #555;border-radius:4px;padding:5px 8px;width:200px;">

    <input type="number" id="cantidadAlumno" placeholder="Cantidad" min="1">

    <button onclick="agregarDetalleAlumno()">Agregar</button>
</div>

<div id="panelMensaje" class="panel oculto">
    <h3>Mensaje para WhatsApp</h3>
    <textarea id="mensajeWhatsapp" readonly rows="20"
        style="width:100%; background:#0d1117; color:white; border:1px solid #444; padding:10px; font-family:Arial, sans-serif;"></textarea>
    <br><br>
    <button onclick="copiarMensaje()">📋 Copiar mensaje</button>
</div>

</div>

<script>

const STORAGE_KEY = "comp6_parte_fuerza";

const MOTIVOS = [
"","Abanderado","Guardia Honor","Escuadra Servicio",
"Entrante Servicio","Saliente Servicio","Comisión Servicio",
"Reposo","Hospital","Franco","Permiso Especial","Interno",
"Izador","Banda","Banda Instrumental","Pelotón Concentración",
"Monitor","Escolta","Llega más tarde","Casa",'Licencia","Otro"
];

const MOTIVOS_EXTRA_PP = [
"Permiso Administrativo","Feriado Legal",
"Saliente de Guardia","Entrante de Guardia"
];

let personal = [];
let detalleAlumnos = [];
let fuerzaPP = 102;
let fuerzaALM = 75;
let nombreCompania = "6TA COMPAÑÍA";
let configAbierta = false;

function guardarLocal(){
    try{
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            personal, detalleAlumnos, fuerzaPP, fuerzaALM, nombreCompania
        }));
        mostrarEstadoGuardado("Guardado " + new Date().toLocaleTimeString());
    }catch(e){
        mostrarEstadoGuardado("⚠️ No se pudo guardar");
    }
}

function cargarLocal(){
    try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(!raw) return false;
        const data = JSON.parse(raw);
        personal       = (data.personal || []).map(p => ({ motivoTexto:"", ...p }));
        detalleAlumnos = data.detalleAlumnos || [];
        fuerzaPP  = typeof data.fuerzaPP  === "number" ? data.fuerzaPP  : 102;
        fuerzaALM = typeof data.fuerzaALM === "number" ? data.fuerzaALM : 75;
        nombreCompania = data.nombreCompania || "6TA COMPAÑÍA";
        document.getElementById("fuerzaPP").value  = fuerzaPP;
        document.getElementById("fuerzaALM").value = fuerzaALM;
        document.getElementById("inputNombreCompania").value = nombreCompania;
        return true;
    }catch(e){ return false; }
}

function mostrarEstadoGuardado(texto){
    const el = document.getElementById("estadoGuardado");
    if(el) el.innerText = texto;
}

function togglePersonal(){
    const panel = document.getElementById("personal");
    const btn   = document.getElementById("btnPersonal");
    const estaVisible = !panel.classList.contains("oculto");
    panel.classList.toggle("oculto");
    btn.classList.toggle("activo", !estaVisible);
}

function toggleDetalleAlumnos(){
    const panel = document.getElementById("panelDetalleAlumnos");
    const btn   = document.getElementById("btnAlumnos");
    const estaVisible = !panel.classList.contains("oculto");
    panel.classList.toggle("oculto");
    btn.classList.toggle("activo", !estaVisible);
}

function toggleConfig(){
    const panel = document.getElementById("configuracion");
    const btn   = document.getElementById("btnConfig");
    const estaVisible = !panel.classList.contains("oculto");
    panel.classList.toggle("oculto");
    btn.classList.toggle("activo", !estaVisible);
    configAbierta = !estaVisible;
    render();
}

function guardarConfiguracion(){
    fuerzaPP  = parseInt(document.getElementById("fuerzaPP").value)  || 0;
    fuerzaALM = parseInt(document.getElementById("fuerzaALM").value) || 0;
    nombreCompania = document.getElementById("inputNombreCompania").value.trim() || "6TA COMPAÑÍA";
    document.getElementById("tituloCompania").textContent = nombreCompania;
    document.title = nombreCompania;
    actualizarResumen();
    guardarLocal();
}

function borrarTodo(){
    if(!confirm("Esto borrará TODO el personal y la configuración guardada. ¿Continuar?")) return;
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
    personal = [];
    detalleAlumnos = [];
    fuerzaPP  = 102;
    fuerzaALM = 75;
    document.getElementById("fuerzaPP").value  = fuerzaPP;
    document.getElementById("fuerzaALM").value = fuerzaALM;
    nombreCompania = "6TA COMPAÑÍA";
    document.getElementById("inputNombreCompania").value = nombreCompania;
    document.getElementById("tituloCompania").textContent = nombreCompania;
    document.title = nombreCompania;
    render();
    mostrarEstadoGuardado("Datos borrados");
}

function agregarPersonal(){
    const grado   = document.getElementById("grado").value;
    const nombre  = document.getElementById("nombre").value;
    const seccion = document.getElementById("seccion").value;
    if(nombre === "") return;
    personal.push({ id:Date.now(), grado, nombre, seccion, presente:true, motivo:"", motivoTexto:"" });
    document.getElementById("nombre").value = "";
    render();
}

function cambiarEstado(id){
    personal = personal.map(p => {
        if(p.id === id){
            p.presente = !p.presente;
            if(p.presente){ p.motivo = ""; p.motivoTexto = ""; }
        }
        return p;
    });
    render();
}

function cambiarMotivo(id, motivo){
    personal = personal.map(p => {
        if(p.id === id){
            p.motivo = motivo;
            if(motivo !== "Otro") p.motivoTexto = "";
        }
        return p;
    });
    actualizarResumen();
    guardarLocal();
}

function cambiarMotivoTexto(id, texto){
    personal = personal.map(p => {
        if(p.id === id) p.motivoTexto = texto;
        return p;
    });
    guardarLocal();
}

function eliminarPersonal(id){
    personal = personal.filter(p => p.id !== id);
    guardarLocal();
    render();
}

function poblarMotivosAlumno(){
    const select = document.getElementById("motivoAlumno");
    MOTIVOS.forEach(m => {
        if(m === "") return;
        const opt = document.createElement("option");
        opt.value = opt.innerText = m;
        select.appendChild(opt);
    });
    select.addEventListener("change", () => {
        const inpTexto = document.getElementById("motivoAlumnoTexto");
        if(inpTexto) inpTexto.style.display = select.value === "Otro" ? "block" : "none";
    });
}

function agregarDetalleAlumno(){
    const motivo   = document.getElementById("motivoAlumno").value;
    const cantidad = parseInt(document.getElementById("cantidadAlumno").value);
    if(motivo === ""){ alert("Selecciona un motivo"); return; }
    if(!cantidad || cantidad < 1){ alert("Ingresa una cantidad válida"); return; }
    let motivoFinal = motivo;
    if(motivo === "Otro"){
        const txt = (document.getElementById("motivoAlumnoTexto") || {}).value || "";
        if(txt.trim() !== "") motivoFinal = txt.trim();
    }
    detalleAlumnos.push({ id:Date.now(), motivo: motivoFinal, cantidad });
    document.getElementById("motivoAlumno").value   = "";
    document.getElementById("cantidadAlumno").value = "";
    const inpTexto = document.getElementById("motivoAlumnoTexto");
    if(inpTexto){ inpTexto.value = ""; inpTexto.style.display = "none"; }
    render();
}

function eliminarDetalleAlumno(id){
    detalleAlumnos = detalleAlumnos.filter(d => d.id !== id);
    guardarLocal();
    render();
}

function renderDetalleAlumnos(){
    const tabla = document.getElementById("tablaDetalleAlumnos");
    tabla.innerHTML = "";
    let total = 0;
    detalleAlumnos.forEach(d => {
        total += d.cantidad;
        const fila = document.createElement("tr");
        const tdM = document.createElement("td"); tdM.textContent = d.motivo;
        const tdC = document.createElement("td"); tdC.textContent = d.cantidad;
        fila.appendChild(tdM);
        fila.appendChild(tdC);
        if(configAbierta){
            const tdE = document.createElement("td");
            const bE = document.createElement("button");
            bE.textContent = "🗑️";
            bE.onclick = () => eliminarDetalleAlumno(d.id);
            tdE.appendChild(bE);
            fila.appendChild(tdE);
        }
        tabla.appendChild(fila);
    });
    document.getElementById("totalDetalleAlumnos").innerHTML = "<b>" + total + "</b>";
    return total;
}

function actualizarResumen(){
    const formanPP     = personal.filter(p => p.seccion === "PP" && p.presente).length;
    const totalDetalle = renderDetalleAlumnos();
    const formanALM    = fuerzaALM - totalDetalle;
    const faltanPP     = fuerzaPP  - formanPP;
    const faltanALM    = totalDetalle;

    document.getElementById("fuerza").innerText       = fuerzaPP + fuerzaALM;
    document.getElementById("forman").innerText       = formanPP + formanALM;
    document.getElementById("faltan").innerText       = faltanPP + faltanALM;
    document.getElementById("ppTotal").innerText      = fuerzaPP;
    document.getElementById("almTotal").innerText     = fuerzaALM;
    document.getElementById("totalGeneral").innerText = fuerzaPP + fuerzaALM;
    document.getElementById("ppForman").innerText     = formanPP;
    document.getElementById("almForman").innerText    = formanALM;
    document.getElementById("totalForman").innerText  = formanPP + formanALM;
    document.getElementById("ppFaltan").innerText     = faltanPP;
    document.getElementById("almFaltan").innerText    = faltanALM;
    document.getElementById("totalFaltan").innerText  = faltanPP + faltanALM;
}

function render(){
    const tabla = document.getElementById("tablaPersonal");
    tabla.innerHTML = "";

    personal.forEach(p => {
        const fila = document.createElement("tr");
        fila.className = p.presente ? "presente" : "ausente";

        const tdBtn = document.createElement("td");
        const btnEstado = document.createElement("button");
        btnEstado.textContent = p.presente ? "✅" : "❌";
        btnEstado.onclick = () => cambiarEstado(p.id);
        tdBtn.appendChild(btnEstado);

        const tdGrado = document.createElement("td");
        tdGrado.textContent = p.grado;

        const tdNombre = document.createElement("td");
        tdNombre.textContent = p.nombre;

const tdMotivo = document.createElement("td");
        const sel = document.createElement("select");
        sel.disabled = p.presente;
        MOTIVOS.concat(MOTIVOS_EXTRA_PP).forEach(m => {
            const opt = document.createElement("option");
            opt.value = m;
            opt.textContent = m;
            if(p.motivo === m) opt.selected = true;
            sel.appendChild(opt);
        });
        sel.onchange = () => cambiarMotivo(p.id, sel.value);
        tdMotivo.appendChild(sel);

        if(!p.presente && p.motivo === "Otro"){
            const inp = document.createElement("input");
            inp.type = "text";
            inp.placeholder = "Especifique...";
            inp.value = p.motivoTexto || "";
            inp.style.cssText = "display:block;margin-top:4px;width:100%;background:#0d1117;color:white;border:1px solid #555;border-radius:4px;padding:5px 8px;";
            inp.oninput = () => cambiarMotivoTexto(p.id, inp.value);
            tdMotivo.appendChild(inp);
        }

        fila.appendChild(tdBtn);
        fila.appendChild(tdGrado);
        fila.appendChild(tdNombre);
        fila.appendChild(tdMotivo);

        if(configAbierta){
            const tdElim = document.createElement("td");
            const btnElim = document.createElement("button");
            btnElim.textContent = "🗑️";
            btnElim.onclick = () => eliminarPersonal(p.id);
            tdElim.appendChild(btnElim);
            fila.appendChild(tdElim);
        }

        tabla.appendChild(fila);
    });

    actualizarResumen();
    guardarLocal();
}

function generarMensaje(){
    actualizarResumen();

    const ppTotal      = document.getElementById("ppTotal").innerText;
    const almTotal     = document.getElementById("almTotal").innerText;
    const totalGeneral = document.getElementById("totalGeneral").innerText;
    const ppForman     = document.getElementById("ppForman").innerText;
    const almForman    = document.getElementById("almForman").innerText;
    const totalForman  = document.getElementById("totalForman").innerText;
    const ppFaltan     = document.getElementById("ppFaltan").innerText;
    const almFaltan    = document.getElementById("almFaltan").innerText;
    const totalFaltan  = document.getElementById("totalFaltan").innerText;

    const pad = (v, w) => String(v).padStart(w, " ");

    let msg = "Buenos días, Parte de fuerza\n\n";
    msg += "PARTE DE FUERZA\n";
    msg += "        P.P.        Alm.\n";
    msg += "F: " + pad(ppTotal,3)  + "      F: " + pad(almTotal,3)  + "      F: " + pad(totalGeneral,3) + "\n";
    msg += "F: " + pad(ppForman,3) + "      F: " + pad(almForman,3) + "      F: " + pad(totalForman,3)  + "\n";
    msg += "F: " + pad(ppFaltan,3) + "      F: " + pad(ppFaltan,3)  + "      F: " + pad(totalFaltan,3)  + "\n\n";

    msg += "Dotación P.P.\n";
    personal.filter(p => p.seccion === "PP").forEach((p, i) => {
        const estado = p.presente ? "✅" : "❌ " + (p.motivo === "Otro" ? (p.motivoTexto || "Otro") : (p.motivo || "Sin motivo"));
        msg += (i+1) + ". " + p.grado + ". " + p.nombre + " " + estado + "\n";
    });

    msg += "\nDetalle Alumnos\n";
    if(detalleAlumnos.length === 0){
        msg += "Sin novedades\n";
    } else {
        detalleAlumnos.forEach(d => {
            msg += d.cantidad + " " + d.motivo.toLowerCase() + "\n";
        });
    }

    document.getElementById("mensajeWhatsapp").value = msg;
    const panelMsg = document.getElementById("panelMensaje");
    const btnWsp   = document.getElementById("btnWhatsapp");
    const estaVisible = !panelMsg.classList.contains("oculto");
    if(estaVisible){
        panelMsg.classList.add("oculto");
        if(btnWsp) btnWsp.textContent = "📲 Generar Mensaje WhatsApp";
    } else {
        panelMsg.classList.remove("oculto");
        if(btnWsp) btnWsp.textContent = "📲 Ocultar Mensaje WhatsApp";
    }
}

function copiarMensaje(){
    const ta = document.getElementById("mensajeWhatsapp");
    ta.select();
    ta.setSelectionRange(0, 999999);
    navigator.clipboard.writeText(ta.value).then(() => {
        alert("Mensaje copiado");
    }).catch(() => {
        try{ document.execCommand("copy"); alert("Mensaje copiado"); }
        catch(e){ alert("No se pudo copiar automáticamente. Selecciona el texto manualmente."); }
    });
}

const habiaDatos = cargarLocal();
poblarMotivosAlumno();
if(!habiaDatos) mostrarEstadoGuardado("Sin datos guardados todavía");
render();

</script>
</body>
</html>
